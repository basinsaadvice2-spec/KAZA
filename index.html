<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Kaza</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ÉCRAN 1 : ACCUEIL & SÉLECTION DU RÔLE (DESIGN ORIGINAL) -->
    <section id="scr-role-select" class="screen-view active">
        <div class="welcome-wrapper">
            <div class="brand-header">
                <div class="brand-icon"><i class="fa-solid fa-house-chimney"></i></div>
                <h1>Kaza</h1>
                <p>Gestion immobilière simple et directe</p>
            </div>
            
            <div class="role-selection-list">
                <button class="role-btn" data-role="tenant">
                    <div class="role-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
                    <div class="role-info">
                        <h3>Locataire</h3>
                        <p>Trouver un logement et gérer mon loyer</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow"></i>
                </button>

                <button class="role-btn" data-role="owner">
                    <div class="role-icon"><i class="fa-solid fa-key"></i></div>
                    <div class="role-info">
                        <h3>Bailleur</h3>
                        <p>Gérer mes biens et mes locataires</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow"></i>
                </button>
            </div>
        </div>
    </section>

    <!-- ÉCRAN 2 : CONNEXION / INSCRIPTION -->
    <section id="scr-auth" class="screen-view">
        <header class="app-header">
            <button class="icon-btn" id="btn-back-role"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 id="auth-title">Connexion</h2>
            <div style="width: 36px;"></div>
        </header>

        <div class="container">
            <div class="card form-card">
                <p id="role-security-info" class="subtitle-info">Espace réservé : Locataire</p>

                <div id="register-fields" style="display: none;">
                    <div class="input-group">
                        <label>Nom complet</label>
                        <input type="text" id="auth-name" placeholder="Ex: Patrick Kabongo">
                    </div>
                    <div class="input-group">
                        <label>Téléphone (WhatsApp)</label>
                        <input type="tel" id="auth-phone" placeholder="Ex: +243810000000">
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="auth-email" placeholder="exemple@email.com">
                </div>
                
                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" id="auth-password" placeholder="••••••">
                </div>
                
                <button id="btn-auth-submit" class="btn-main">Continuer</button>
                <p id="auth-toggle-link" class="link-text">Pas encore de compte ? S'inscrire</p>
            </div>
        </div>
    </section>

    <!-- ÉCRAN 3 : ESPACE LOCATAIRE -->
    <section id="scr-tenant" class="screen-view">
        <header class="app-header">
            <div class="header-brand">
                <i class="fa-solid fa-house-chimney"></i>
                <span>Kaza</span>
            </div>
            <div class="header-tools">
                <button class="icon-btn theme-toggle"><i class="fa-solid fa-moon"></i></button>
                <button class="icon-btn btn-logout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <div class="tabs-bar">
            <button class="tab-item active" data-tab="catalog">Catalogue</button>
            <button class="tab-item" data-tab="my-rental">Mon Logement</button>
            <button class="tab-item" data-tab="tenant-chats">Messages</button>
        </div>

        <!-- BARRE DE RECHERCHE ET FILTRES ÉPURÉS -->
        <div class="filter-bar" id="tenant-search-panel">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="filter-search" placeholder="Avenue, commune ou référence (ex: Socimat)...">
            </div>
            <div class="filter-row">
                <select id="filter-commune">
                    <option value="">Commune (Toutes)</option>
                    <option value="Gombe">Gombe</option>
                    <option value="Ngaliema">Ngaliema</option>
                    <option value="Limete">Limete</option>
                    <option value="Lingwala">Lingwala</option>
                    <option value="Kintambo">Kintambo</option>
                    <option value="Bandalungwa">Bandalungwa</option>
                    <option value="Kasa-Vubu">Kasa-Vubu</option>
                    <option value="Lemba">Lemba</option>
                    <option value="Matete">Matete</option>
                    <option value="Masina">Masina</option>
                    <option value="Ndjili">Ndjili</option>
                    <option value="Mont-Ngafula">Mont-Ngafula</option>
                </select>
                <select id="filter-type">
                    <option value="">Type (Tous)</option>
                    <option value="Appartement">Appartement</option>
                    <option value="Maison">Maison</option>
                    <option value="Studio">Studio</option>
                </select>
            </div>
            <div class="filter-row" style="margin-top: 8px;">
                <input type="number" id="filter-max-price" placeholder="Prix Max ($)">
                <select id="filter-snel">
                    <option value="">Électricité (Toutes)</option>
                    <option value="Cash Power">Cash Power</option>
                    <option value="Forfait">Forfait SNEL</option>
                    <option value="Groupe/Solaire">Groupe / Solaire</option>
                </select>
                <select id="filter-water">
                    <option value="">Eau (Toutes)</option>
                    <option value="Regideso">Regideso</option>
                    <option value="Forage/Citerne">Forage / Citerne</option>
                </select>
            </div>
        </div>

        <main id="tenant-content" class="container"></main>
    </section>

    <!-- ÉCRAN 4 : ESPACE BAILLEUR -->
    <section id="scr-owner" class="screen-view">
        <header class="app-header">
            <div class="header-brand">
                <i class="fa-solid fa-key"></i>
                <span>Kaza Bailleur</span>
            </div>
            <div class="header-tools">
                <button class="icon-btn theme-toggle"><i class="fa-solid fa-moon"></i></button>
                <button class="icon-btn btn-logout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <div class="tabs-bar">
            <button class="tab-item active" data-tab="owner-apparts">Mes Biens</button>
            <button class="tab-item" data-tab="owner-add">+ Publier</button>
            <button class="tab-item" data-tab="owner-broadcast">Diffusion</button>
            <button class="tab-item" data-tab="owner-chats">Messages</button>
        </div>

        <main id="owner-content" class="container"></main>
    </section>

    <!-- ÉCRAN 5 : MESSAGERIE PRIVÉE -->
    <section id="scr-chat-room" class="screen-view">
        <header class="app-header">
            <button class="icon-btn" id="btn-close-chat"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="chat-header-info">
                <h3 id="chat-room-title">Discussion</h3>
                <span id="chat-room-subtitle"></span>
            </div>
            <div style="width: 36px;"></div>
        </header>

        <div id="chat-messages-container" class="chat-messages"></div>

        <div class="chat-footer">
            <input type="text" id="chat-input-field" placeholder="Votre message...">
            <button id="btn-send-msg" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </section>

    <!-- MODALE QUITTANCE DE LOYER -->
    <div id="receipt-modal" class="modal-backdrop" style="display:none;">
        <div class="card modal-box" id="receipt-printable">
            <div class="receipt-top">
                <h3>Quittance de Loyer</h3>
                <span class="tag-success">Payé & Validé</span>
            </div>
            <div id="receipt-body" class="receipt-content"></div>
            <div class="btn-group-row">
                <button onclick="window.print()" class="btn-main">Imprimer / PDF</button>
                <button id="btn-close-receipt" class="btn-outline">Fermer</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
